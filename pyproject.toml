[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "matzlin-lorapeft_jd250"
version = "0.1.0"
description = "按结构键把条目聚类，标出LoRA 与参数高效微调研究员·知识库的时效性维护上的同组项与各组的代表样本"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "matzlin" }]
keywords = ["cli", "analysis", "observability", "evaluation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://matzlin.github.io"
Repository = "https://github.com/matzlin/lorapeft_jd250"
Issues = "https://github.com/matzlin/lorapeft_jd250/issues"

[project.scripts]
lorapeft_jd250 = "lorapeft_jd250:main"

[tool.setuptools]
py-modules = ["lorapeft_jd250"]
